name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Bewerbo.slnx -c Release

      - name: Test
        run: dotnet test Bewerbo.slnx -c Release --no-build

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: tests/Bewerbo.Tests/bin/Release/net10.0-windows/screenshots
          if-no-files-found: ignore
