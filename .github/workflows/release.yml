name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Bewerbo.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Bewerbo/Bewerbo.csproj -p:PublishProfile=win-x64 -p:Version=$version

      # Attach the single-file exe itself, so people download one file and run it.
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/Bewerbo.exe
          generate_release_notes: true
